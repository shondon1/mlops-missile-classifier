apiVersion: apps/v1
kind: Deployment
metadata:
  name: missile-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missile-api
  template:
    metadata:
      labels:
        app: missile-api
    spec:
      containers:
      - name: missile-api
        image: missile-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5